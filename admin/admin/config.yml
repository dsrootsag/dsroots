backend:
  name: git-gateway
  branch: main # Change this to 'master' if your GitHub default branch is master

media_folder: "assets/uploads" # Images uploaded via CMS will go here
public_folder: "/assets/uploads" # The path the website uses to find them

collections:
  - name: "blog"
    label: "News & Updates"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
