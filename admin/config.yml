backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads" 
public_folder: "/assets/uploads" 

collections:
  - name: "settings"
    label: "Website Settings (Homepage)"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "_data/homepage.json"
        fields:
          - {label: "Hero Background Image", name: "hero_image", widget: "image"}
          - {label: "Main Title", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}

  - name: "gallery"
    label: "Photo Gallery"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text", required: false}

  - name: "videos"
    label: "Video Gallery"
    folder: "_videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Video Title", name: "title", widget: "string"}
      - {label: "Upload Video (MP4)", name: "video_file", widget: "file", required: false}
      - {label: "Or YouTube Video Link", name: "youtube_url", widget: "string", required: false}

  - name: "blog"
    label: "News & Updates"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
