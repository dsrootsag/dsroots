backend:
  name: github
  repo: dsrootsag/dsroots # Your exact GitHub username/repo
  branch: main
  base_url: https://api.netlify.com # Keep this if you already linked Netlify, it handles the GitHub Auth

media_folder: "assets/uploads" # Photos will go here
public_folder: "/assets/uploads" # How the website will find them

collections:
  # 1. WEBSITE SETTINGS (Update Hero Background & Text)
  - name: "settings"
    label: "Website Settings (Homepage)"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "_data/homepage.json"
        fields:
          - {label: "Hero Background Image", name: "hero_image", widget: "image"}
          - {label: "Main Title", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Subtitle", name: "subtitle", widget: "text"}

  # 2. PHOTO GALLERY
  - name: "gallery"
    label: "Photo Gallery"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text", required: false}

  # 3. VIDEO GALLERY
  - name: "videos"
    label: "Video Gallery"
    folder: "_videos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Video Title", name: "title", widget: "string"}
      - {label: "Upload Video (MP4)", name: "video_file", widget: "file", required: false}
      - {label: "Or YouTube Video Link", name: "youtube_url", widget: "string", required: false}

  # 4. NEWS & UPDATES
  - name: "blog"
    label: "News & Updates"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
