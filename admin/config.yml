backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "Website Settings"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "_data/homepage.json"
        fields:
          - {label: "Hero Background Image", name: "hero_image", widget: "image"}
          - {label: "Main Title", name: "title", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}

  - name: "gallery"
    label: "Photo Gallery"
    folder: "_gallery"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}

  - name: "videos"
    label: "Video Gallery"
    folder: "_videos"
    create: true
    fields:
      - {label: "Video Title", name: "title", widget: "string"}
      - {label: "Upload Video", name: "video_file", widget: "file", required: false}
      - {label: "YouTube Link", name: "youtube_url", widget: "string", required: false}

  - name: "blog"
    label: "News & Updates"
    folder: "_posts"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
